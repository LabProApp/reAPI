<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset Successful</title>
  <style>
    body{margin:0;padding:0;background:#f4f6f8;font-family:'Segoe UI',Arial,sans-serif;color:#222;}
    .wrapper{max-width:560px;margin:40px auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);}
    .header{background:#2e7d32;padding:28px 32px;}
    .header h1{margin:0;font-size:22px;color:#fff;}
    .header p{margin:4px 0 0;font-size:13px;color:#c8e6c9;}
    .body{padding:36px 32px;}
    .success-icon{text-align:center;font-size:56px;margin:8px 0 20px;}
    .info{font-size:15px;color:#444;line-height:1.8;}
    .cta{text-align:center;margin:28px 0;}
    .cta a{background:#2e7d32;color:#fff;text-decoration:none;padding:14px 36px;border-radius:6px;font-size:15px;font-weight:600;display:inline-block;}
    .warning{background:#fce4ec;border-left:4px solid #e91e63;padding:12px 16px;border-radius:4px;font-size:13px;color:#880e4f;margin-top:20px;}
    .footer{background:#f4f6f8;padding:18px 32px;text-align:center;font-size:12px;color:#888;border-top:1px solid #e8eaed;}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1 th:text="${app}">KeyBricks</h1>
    <p>Your password has been updated</p>
  </div>
  <div class="body">
    <div class="success-icon">✅</div>
    <p>Hi <strong th:text="${name}">User</strong>,</p>
    <p class="info">Your password has been reset successfully. You can now log in with your new password.</p>
    <div class="cta">
      <a th:href="${loginUrl}" href="#">Log In Now</a>
    </div>
    <div class="warning">
      If you did not make this change, contact our support team immediately to secure your account.
    </div>
  </div>
  <div class="footer">
    &copy; <span th:text="${app}">KeyBricks</span> &mdash; Security notification.
  </div>
</div>
</body>
</html>
