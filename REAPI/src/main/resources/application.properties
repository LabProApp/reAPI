# ===============================
#  Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://qa-keybricks.cb4wuys66c2w.eu-north-1.rds.amazonaws.com:3306/realestate_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:}

# Fail fast (60s) if DB is unreachable at startup — surfaces real connection errors
# instead of silently starting with a broken pool.
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=10000

spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ===============================
#  JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Batch JDBC inserts/updates — speeds up saveAll() for bulk document uploads etc.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
#  Server Configuration
# ===============================
server.port=${PORT:8080}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
#  Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ===============================
#  Notification Config
# ===============================
app.admin.email=${ADMIN_EMAIL:}
app.admin.mobile=${ADMIN_MOBILE:}

# ===============================
#  AWS S3 Configuration
# ===============================
aws.s3.bucket-name=${AWS_S3_BUCKET:re-api-qa}
aws.s3.region=${AWS_REGION:ap-south-1}
# Empty defaults so missing env vars do not fail startup;
# uploads/downloads will fail at call-time with a clear error.
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-south-1}

# ===============================
#  Twilio SMS / WhatsApp
# ===============================
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.source.number=${TWILIO_FROM_NUMBER:+12762626783}

# ===============================
#  Mail (AWS SES SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:email-smtp.ap-south-1.amazonaws.com}
spring.mail.port=${MAIL_PORT:587}
# Empty defaults so missing env vars do not fail startup;
# CommService skips sends when credentials are blank.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
#  JWT Configuration
# ===============================
# Dev default (Base64-encoded, 69 bytes — well above the 32-byte HS256 minimum).
# MUST be overridden in production via JWT_SECRET env var.
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktand0LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1pdC1pbi1wcm9kdWN0aW9uLWVudmlyb25tZW50}
# Token lifetime in hours (default 24h)
jwt.expiration.hours=${JWT_EXPIRATION_HOURS:24}

# ===============================
#  CORS
# ===============================
# Comma-separated origins; "*" allows all (dev only).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================
#  CIBIL API
# ===============================
api.hostname=${CIBIL_API_HOST:https://sandbox.surepass.io}
api.cibi.url=/api/v1/credit-report-cibil/fetch-report
api.token=${CIBIL_API_TOKEN:}
