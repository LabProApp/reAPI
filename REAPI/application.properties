# ===============================
#  MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=mypass


